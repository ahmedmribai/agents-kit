name: CI

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify package and citation version consistency
        run: |
          python - <<'PY'
          import agents_kit

          with open("pyproject.toml", encoding="utf-8") as f:
              package_version = next(
                  line.split("=", 1)[1].strip().strip('"')
                  for line in f if line.strip().startswith("version =")
              )
          with open("CITATION.cff", encoding="utf-8") as f:
              citation_version = next(
                  line.split(":", 1)[1].strip().strip('"')
                  for line in f if line.startswith("version:")
              )
          assert package_version == agents_kit.__version__ == citation_version
          print(f"Consistent version metadata: {package_version}")
          PY

      - name: Compile package and examples
        run: python -m compileall -q agents_kit examples

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run documentation example
        run: python examples/basic_usage.py

  package:
    name: Build and validate distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

  framework-integrations:
    name: LangChain middleware integration smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LangChain and package
        run: |
          python -m pip install --upgrade pip langchain
          python -m pip install -e .

      - name: Verify middleware factory
        run: |
          python -c "from agents_kit.integrations.langchain import build_output_gate_middleware; middleware = build_output_gate_middleware([lambda text: bool(text.strip())]); assert middleware is not None"

  openai-agents:
    name: OpenAI Agents SDK adapter smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install optional framework and package
        run: |
          python -m pip install --upgrade pip openai-agents
          python -m pip install -e .

      - name: Verify adapter registration against the SDK
        run: |
          python -c "from agents_kit.integrations.openai_agents import build_output_guardrail; guardrail = build_output_guardrail([lambda output: bool(str(output).strip())]); assert guardrail.get_name() == 'quality_guardrail'"
