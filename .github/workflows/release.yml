name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag and version metadata
        run: |
          python - <<'PY'
          import os
          import tomllib
          import agents_kit

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          with open("CITATION.cff", encoding="utf-8") as f:
              citation_version = next(
                  line.split(":", 1)[1].strip().strip('"')
                  for line in f if line.startswith("version:")
              )
          assert project_version == tag, (project_version, tag)
          assert agents_kit.__version__ == tag, (agents_kit.__version__, tag)
          assert citation_version == tag, (citation_version, tag)
          print(f"Release version verified: {tag}")
          PY

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"

      - name: Compile package and examples
        run: python -m compileall -q agents_kit examples

      - name: Run tests and basic example
        run: |
          python -m pytest tests/ -q
          python examples/basic_usage.py

      - name: Build distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Upload verified distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish verified artifacts to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/agents-toolkit/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
